# Applies EF Core migrations using a prebuilt migration bundle.
# The bundle is generated at image build time, so this Job needs no SDK,
# no EF tools and no application source.
apiVersion: batch/v1
kind: Job
metadata:
  name: clinetest-db-migrate
  namespace: clinetest
  labels:
    app.kubernetes.io/name: clinetest-db-migrate
    app.kubernetes.io/part-of: clinetest
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinetest-db-migrate
        app.kubernetes.io/part-of: clinetest
    spec:
      restartPolicy: OnFailure
      initContainers:
        # The bundle connects immediately, so wait for MySQL to accept
        # connections instead of relying on Job restarts.
        - name: wait-for-mysql
          image: busybox:1.36
          # busybox runs as root; it only opens a TCP socket.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "waiting for mysql..."
                sleep 3
              done
              echo "mysql is reachable"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: migrate
          image: clinetest-migrator:local
          imagePullPolicy: Never
          env:
            # Consumed by the bundle entrypoint, which forwards it to
            # `efbundle --connection`. The design-time host does not read
            # ConnectionStrings__DefaultConnection from the environment.
            - name: CLINETEST_MIGRATION_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: mysql-connection-string
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: mysql-connection-string
            - name: CLINETEST_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-bucket
            - name: CLINETEST_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-region
            - name: CLINETEST_ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: elasticsearch-url
            - name: CLINETEST_ELASTICSEARCH_INDEX
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: elasticsearch-index
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi