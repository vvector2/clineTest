# Development / local-cluster credentials only.
# For a shared or production environment, replace this file with an external
# secret store (External Secrets Operator, Vault, cloud secret manager) and drop
# this manifest from the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: clinetest-secrets
  namespace: clinetest
  labels:
    app.kubernetes.io/part-of: clinetest
type: Opaque
stringData:
  mysql-root-password: "root"
  mysql-user: "clinetest"
  mysql-password: "clinetest"
  # Host must be the in-cluster Service name, not localhost.
  mysql-connection-string: "Server=mysql;Port=3306;Database=clinetest;User Id=clinetest;Password=clinetest;SslMode=None;AllowPublicKeyRetrieval=True;"
  s3-access-key: "test"
  s3-secret-key: "test"
  s3-bucket: "clinetest-posters"
  s3-region: "us-east-1"
  elasticsearch-url: "http://elasticsearch:9200"
  elasticsearch-index: "movies"