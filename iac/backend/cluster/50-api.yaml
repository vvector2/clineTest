---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinetest-api
  namespace: clinetest
  labels:
    app.kubernetes.io/name: clinetest-api
    app.kubernetes.io/part-of: clinetest
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clinetest-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinetest-api
        app.kubernetes.io/part-of: clinetest
    spec:
      # The aspnet:8.0 image already runs as the built-in non-root `app` user
      # (set by USER app in Dockerfile.api). Setting runAsNonRoot here would
      # fail because Kubernetes cannot verify the non-numeric user "app".
      # runAsUser is pinned instead so the numeric uid is enforced.
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      # Wait for MySQL before starting: AddDal() calls ServerVersion.AutoDetect(),
      # which opens a real connection during startup and throws if MySQL is down.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          # busybox runs as root, so it must opt out of the pod-level
          # runAsNonRoot. It only opens a TCP socket and never writes anything.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "waiting for mysql..."
                sleep 3
              done
              echo "mysql is reachable"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: api
          image: clinetest-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: mysql-connection-string
            - name: CLINETEST_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-bucket
            - name: CLINETEST_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-region
            - name: CLINETEST_S3_SERVICE_URL
              value: "http://localstack:4566"
            - name: CLINETEST_S3_PUBLIC_BASE_URL
              value: "http://localstack:4566"
            - name: CLINETEST_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-access-key
            - name: CLINETEST_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-secret-key
            - name: CLINETEST_S3_FORCE_PATH_STYLE
              value: "true"
            - name: CLINETEST_ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: elasticsearch-url
            - name: CLINETEST_ELASTICSEARCH_INDEX
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: elasticsearch-index
          # The API exposes no health endpoint, so probe the TCP listener.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: clinetest-api
  namespace: clinetest
  labels:
    app.kubernetes.io/name: clinetest-api
    app.kubernetes.io/part-of: clinetest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clinetest-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The load balancer. minikube provisions an external IP for this; on kind use the
# MetalLB addon, and on a managed cluster it maps to a cloud load balancer.
apiVersion: v1
kind: Service
metadata:
  name: clinetest-api-lb
  namespace: clinetest
  labels:
    app.kubernetes.io/name: clinetest-api
    app.kubernetes.io/part-of: clinetest
  spec:
    type: LoadBalancer
    selector:
      app.kubernetes.io/name: clinetest-api
    ports:
      - name: http
        port: 80
      targetPort: http