---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: clinetest
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: clinetest
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: localstack
  namespace: clinetest
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: clinetest
spec:
  serviceName: localstack
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/part-of: clinetest
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: edge
              containerPort: 4566
          env:
            - name: SERVICES
              value: s3
            - name: DEBUG
              value: "0"
            - name: PERSISTENCE
              value: "1"
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-region
                  optional: true
            - name: S3_POSTERS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: clinetest-secrets
                  key: s3-bucket
            - name: LOCALSTACK_AUTH
              value: "0"
          startupProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
            - name: var-run
              mountPath: /var/run/localstack
            - name: init-ready-d
              mountPath: /etc/localstack/init/ready.d
              readOnly: true
      volumes:
        - name: var-run
          emptyDir: {}
        - name: init-ready-d
          configMap:
            name: localstack-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi