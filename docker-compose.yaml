name: clinetest

services:
  db:
    image: mysql:8.4
    container_name: clinetest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clinetest}
      MYSQL_USER: ${MYSQL_USER:-clinetest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clinetest}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  localstack:
    image: "${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0}"
    container_name: clinetest-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_POSTERS_BUCKET: ${S3_POSTERS_BUCKET:-clinetest-posters}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  localstack-data:
